[project]
name = "pythonbot"
version = "0.1.0"
description = "Um agente AI local-first que funciona como organismo vivo no sistema operacional."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
]

[project.optional-dependencies]
telegram = ["aiogram>=3.10.0"]
mcp = ["mcp[cli]>=1.0.0"]
voice = ["edge-tts>=6.1.9"]
stt = ["openai-whisper>=20231117"]
browser = ["playwright>=1.40.0"]
memory = ["mempalace>=3.3.1"]
all = [
    "aiogram>=3.10.0",
    "mcp[cli]>=1.0.0",
    "edge-tts>=6.1.9",
    "openai-whisper>=20231117",
    "playwright>=1.40.0",
    "mempalace>=3.3.1",
]

[project.scripts]
pythonbot = "pythonbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pythonbot"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
